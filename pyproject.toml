[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-diff-viewer"
version = "0.1.0"
description = "Compare two files byte by byte, with a Qt viewer and a small CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6"]
pe = ["pefile"]
dev = ["PySide6", "pefile", "pytest", "ruff"]

[project.scripts]
bindiff = "bindiff.cli:main"
bindiff-gui = "bindiff.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
